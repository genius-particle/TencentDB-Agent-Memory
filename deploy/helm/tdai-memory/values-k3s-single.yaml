# Overlay for 170 Traefik + nip.io. Do NOT use these NodePorts/host on the
# cluster that already runs official tdai-memory (30420/30125/30424/30096,
# tdai.192.168.11.170.nip.io). That install uses values-eodev.yaml.

public:
  host: 192.168.11.170

ingress:
  enabled: true
  className: traefik
  host: tdai.192.168.11.170.nip.io
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

core:
  service:
    type: NodePort
    nodePort: 30420
  persistence:
    storageClass: local-path

hub:
  service:
    type: NodePort
    panelNodePort: 30125
    knowledgeNodePort: 30424
  persistence:
    storageClass: local-path

proxy:
  service:
    type: NodePort
    nodePort: 30096

postgres:
  persistence:
    storageClass: local-path

minio:
  persistence:
    storageClass: local-path
