{{- if .Values.core.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tdai-memory.core.fullname" . }}-data
  labels:
    {{- include "tdai-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-core
spec:
  accessModes:
    - {{ .Values.core.persistence.accessMode | quote }}
  {{- if .Values.core.persistence.storageClass }}
  storageClassName: {{ .Values.core.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.core.persistence.size }}
{{- end }}
---
