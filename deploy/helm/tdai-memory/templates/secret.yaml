{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdai-memory.secretName" . }}
  labels:
    {{- include "tdai-memory.labels" . | nindent 4 }}
type: Opaque
stringData:
  MEMORY_LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  MEMORY_LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  MEMORY_LLM_MODEL: {{ .Values.llm.model | quote }}
  MEMORY_LLM_PROTOCOL: {{ .Values.llm.protocol | quote }}
  PROXY_UPSTREAM_URL: {{ .Values.proxy.upstream.url | quote }}
  PROXY_UPSTREAM_API_KEY: {{ .Values.proxy.upstream.apiKey | quote }}
  PROXY_UPSTREAM_MODEL: {{ .Values.proxy.upstream.model | quote }}
  ADMIN_USERNAME: {{ .Values.admin.username | quote }}
  ADMIN_USER_KEY: {{ .Values.admin.userKey | quote }}
  {{- if .Values.embedding.apiKey }}
  EMBEDDING_API_KEY: {{ .Values.embedding.apiKey | quote }}
  {{- end }}
  {{- if .Values.redis.auth.password }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  {{- end }}
  {{- if eq .Values.store.mode "postgres" }}
  DATABASE_URL: {{ include "tdai-memory.databaseUrl" . | quote }}
  TDAI_METADATA_POSTGRES_URL: {{ include "tdai-memory.databaseUrl" . | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  {{- end }}
  {{- if or .Values.minio.deploy .Values.minio.endpoint }}
  S3_ENDPOINT: {{ include "tdai-memory.s3Endpoint" . | quote }}
  S3_ACCESS_KEY: {{ .Values.minio.auth.rootUser | quote }}
  S3_SECRET_KEY: {{ .Values.minio.auth.rootPassword | quote }}
  S3_BUCKET: {{ .Values.minio.bucket | quote }}
  MINIO_ROOT_USER: {{ .Values.minio.auth.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.auth.rootPassword | quote }}
  {{- end }}
{{- end }}
