  name: {{ include "tdai-memory.fullname" . }}-public-urls
  labels:
    {{- include "tdai-memory.labels" . | nindent 4 }}
data:
  KNOWLEDGE_PUBLIC_BASE_URL: {{ include "tdai-memory.public.knowledgeUrl" . | quote }}
  MEMORY_HUB_PROXY_PUBLIC_URL: {{ include "tdai-memory.public.proxyUrl" . | quote }}
