# 192.168.11.170 k3s — fork chart beside official namespace tdai-memory.
# Official keeps NodePort 30420/30125/30424/30096 and host tdai.192.168.11.170.nip.io.
#
#   helm upgrade --install tdai-open deploy/helm/tdai-memory \
#     -n tdai-open --create-namespace \
#     -f deploy/helm/tdai-memory/values-eodev.yaml \
#     --set llm.apiKey=... --set proxy.upstream.apiKey=... --set embedding.apiKey=...

fullnameOverride: tdai-open

llm:
  baseUrl: https://apihub.agnes-ai.com/v1
  model: agnes-2.5-flash
  protocol: openai

proxy:
  upstream:
    url: https://apihub.agnes-ai.com/v1
    model: agnes-2.5-flash
  service:
    type: NodePort
    nodePort: 31096

image:
  registry: registry.cn-qingdao.aliyuncs.com/eo
  tag: feat-server-team
  pullPolicy: IfNotPresent
  core:
    repository: ghcr.io.genius-particle.tencentdb-agent-memory.memory-core
  hub:
    repository: ghcr.io.genius-particle.tencentdb-agent-memory.memory-hub
  proxy:
    repository: ghcr.io.genius-particle.tencentdb-agent-memory.memory-proxy

public:
  host: 192.168.11.170

ingress:
  enabled: true
  className: traefik
  host: tdai-open.192.168.11.170.nip.io
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

core:
  service:
    type: NodePort
    nodePort: 31420
  persistence:
    storageClass: local-path
    size: 5Gi

hub:
  service:
    type: NodePort
    panelNodePort: 31125
    knowledgeNodePort: 31424
  persistence:
    storageClass: local-path
    size: 5Gi

postgres:
  image:
    repository: registry.cn-qingdao.aliyuncs.com/eo/paradedb.paradedb
    tag: v0.18.9-pg17
    pullPolicy: IfNotPresent
  persistence:
    storageClass: local-path
    size: 5Gi

redis:
  persistence:
    storageClass: local-path
    size: 2Gi

minio:
  deploy: false
