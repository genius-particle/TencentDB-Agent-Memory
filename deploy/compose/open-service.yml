# Open-service stack (Phase 2–3)
#
# Postgres+pgvector (memory store) + Postgres (metadata) + MinIO (blob) + Redis (state).
# Does NOT change live deployMode=service defaults (still tcvdb+cos+redis+mongo).
# Using this file is opt-in: set STORE_MODE=postgres, STORAGE_BACKEND=s3, and
# TDAI_METADATA_BACKEND=postgres on the Gateway process. Leave those env vars
# unset and production stays on TCVDB + COS + Mongo.
#
# Metadata shares this Postgres instance (schema tdai_metadata_{instanceId}),
# separate from memory schemas (mem_*). DATABASE_URL alone does not select
# metadata postgres — TDAI_METADATA_BACKEND=postgres (or TDAI_METADATA_POSTGRES_URL)
# is required. Do not set TDAI_DEPLOY_MODE=service here — that path still
# expects Mongo + COS + TCVDB unless postgres metadata is explicit.
#
# Usage:
#   docker compose -f deploy/compose/open-service.yml up -d
#   export STORE_MODE=postgres
#   export STORAGE_BACKEND=s3
#   export DATABASE_URL=postgres://memory:memory@127.0.0.1:5432/memory
#   export TDAI_METADATA_BACKEND=postgres
#   export S3_ENDPOINT=http://127.0.0.1:9000
#   export S3_ACCESS_KEY=minioadmin
#   export S3_SECRET_KEY=minioadmin
#   export S3_BUCKET=tdai-memory
#   export S3_FORCE_PATH_STYLE=true
#   export STATE_BACKEND=redis
#   export REDIS_HOST=127.0.0.1
#   # keep TDAI_DEPLOY_MODE=standalone (default)
#   cd MemoryCore && npx tsx src/gateway/server.ts
#
# Contract tests against this Postgres:
#   DATABASE_URL=postgres://memory:memory@127.0.0.1:5432/memory npm test -- postgres.contract

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
       mc mb -p local/tdai-memory || true"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  miniodata:
